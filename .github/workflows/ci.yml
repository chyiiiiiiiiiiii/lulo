name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: false
      - name: Resolve workspace
        run: flutter pub get
      # The gate runs the tone-probe tests, and they measure real waveforms.
      # The other sidecars' tests are import-light on purpose and need
      # nothing installed; this one genuinely needs numpy, and without it the
      # gate reported a missing module as a failing measurement tool.
      - name: Resolve sidecar dependencies
        run: python3 -m pip install --disable-pip-version-check -r sidecars/tone_probe/requirements.txt
      - name: Run quality gate
        run: dart tool/verify.dart
