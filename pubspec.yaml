name: flutter_local_agent_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - apps/local_agent_macos
  - benchmarks/storage_benchmark
  - benchmarks/voice_eval
  - packages/agent_core

dev_dependencies:
  # `tool/generate_turn_taking_lexicon.dart` reads the turn-taking lexicon
  # from its one source and writes the native copy, so the tool layer has to
  # be able to import the core it generates from.
  agent_core: ^0.1.0
  flutter_lints: ^6.0.0
  pigeon: ^26.0.1
